<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--deploy-only-->
<meta name="theme-color" content="#0E6B4A">
<meta name="description" content="Track stock, sales, income and expenses for your shop. Works on phone, tablet and computer, even offline.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<!--/deploy-only-->
<title>Dokan Khata</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: ledger-style app shell. Side rail on wide screens, bottom tab bar on phones. */
:root{
  --bg:#F2F5F0; --surface:#FFFFFF; --surface-2:#E8EEE7; --ink:#16231B; --muted:#5A6B60; --line:#D5DED4;
  --accent:#0E6B4A; --accent-ink:#FFFFFF; --accent-soft:#DAEEE3;
  --gold:#A8700A; --gold-soft:#FBEFD3;
  --danger:#B3372A; --danger-soft:#FBE3DF; --warn:#9A6212; --warn-soft:#FBEBD0; --ok:#1C7D4D;
  --shadow:0 1px 2px rgba(22,35,27,.06),0 6px 20px rgba(22,35,27,.07);
  --font-body:"Hind Siliguri",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-num:"Space Grotesk","Hind Siliguri",system-ui,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1511; --surface:#16201A; --surface-2:#1E2A23; --ink:#E5EEE8; --muted:#9AAEA1; --line:#2A3830;
  --accent:#3DBE8A; --accent-ink:#04120B; --accent-soft:#183A2B;
  --gold:#E8B84A; --gold-soft:#3A2E12;
  --danger:#F07A6A; --danger-soft:#3E1D19; --warn:#E5A949; --warn-soft:#3A2B12; --ok:#5FD39A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1511; --surface:#16201A; --surface-2:#1E2A23; --ink:#E5EEE8; --muted:#9AAEA1; --line:#2A3830;
  --accent:#3DBE8A; --accent-ink:#04120B; --accent-soft:#183A2B;
  --gold:#E8B84A; --gold-soft:#3A2E12;
  --danger:#F07A6A; --danger-soft:#3E1D19; --warn:#E5A949; --warn-soft:#3A2B12; --ok:#5FD39A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font-body);-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--font-num);margin:0;line-height:1.2;text-wrap:balance}
h1{font-size:1.5rem} h2{font-size:1.1rem} h3{font-size:.95rem}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.app{display:grid;grid-template-columns:1fr;min-height:100%}
/* side rail */
.side{display:none}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.brand-mark{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-family:var(--font-num);flex:none}
.brand-text{min-width:0}
.brand-text b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:1rem;line-height:1.2}
.brand-text span{font-size:.75rem;color:var(--muted)}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;height:38px;min-width:38px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.iconbtn svg{width:18px;height:18px}
.main{min-width:0;width:100%;max-width:1240px;margin:0 auto;padding-block:16px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.bottomnav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 7px;color:var(--muted);text-decoration:none;font-size:.72rem;font-weight:500}
.bottomnav a svg{width:22px;height:22px}
.bottomnav a.on{color:var(--accent)}
.bottomnav a.sellbtn svg{background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:5px;width:34px;height:34px;margin-top:-14px;box-shadow:var(--shadow)}
@media (min-width:900px){
  .app{grid-template-columns:236px 1fr}
  .topbar,.bottomnav{display:none}
  body::before{background:var(--bg)}
  .side{display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;padding:20px 14px;padding-left:max(14px,env(safe-area-inset-left,0px));border-right:1px solid var(--line);background:var(--surface)}
  .side .brand{flex:none;margin:0 6px 18px}
  .side a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--ink);text-decoration:none;font-weight:500}
  .side a svg{width:20px;height:20px;color:var(--muted)}
  .side a:hover{background:var(--surface-2)}
  .side a.on{background:var(--accent-soft);color:var(--accent)}
  .side a.on svg{color:var(--accent)}
  .side .grow{flex:1}
  .main{padding-block:28px 48px}
}
/* generic */
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.danger.armed{background:var(--danger);color:var(--surface)}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;white-space:nowrap;font-weight:500;font-size:.9rem}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:1px 9px;font-size:.75rem;font-weight:600;white-space:nowrap}
.pill.low{background:var(--warn-soft);color:var(--warn)}
.pill.out{background:var(--danger-soft);color:var(--danger)}
.pill.ok{background:var(--accent-soft);color:var(--accent)}
.pill.gold{background:var(--gold-soft);color:var(--gold)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:.82rem;font-weight:600;color:var(--muted)}
.input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;min-height:42px}
.input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.search{position:relative;flex:1;min-width:180px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.search .input{padding-left:36px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.page-head p{margin:2px 0 0;color:var(--muted)}
.banner{background:var(--gold-soft);color:var(--ink);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}
.banner p{margin:0;min-width:0;flex:1 1 240px}
.empty{text-align:center;color:var(--muted);padding:28px 12px}
/* dashboard */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:14px}
@media (min-width:700px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.tile .lbl{font-size:.8rem;color:var(--muted);font-weight:600;letter-spacing:.02em}
.tile .val{font-family:var(--font-num);font-size:1.45rem;font-weight:700;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .sub{font-size:.78rem;color:var(--muted)}
.tile.hero{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tile.hero .lbl,.tile.hero .sub{color:inherit;opacity:.85}
.neg{color:var(--danger)}
.dash{display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:1000px){.dash{grid-template-columns:1.6fr 1fr}}
.chart svg{width:100%;height:auto;display:block}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);min-width:0}
.li:first-child{border-top:0}
.li .grow{flex:1;min-width:0}
.li .grow b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.li .amt{font-family:var(--font-num);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
button.li{background:none;border:0;border-top:1px solid var(--line);width:100%;text-align:left;padding:10px 4px}
button.li:first-child{border-top:0}
button.li:hover{background:var(--surface-2)}
.thumb{width:40px;height:40px;border-radius:9px;background:var(--surface-2);display:grid;place-items:center;font-size:1.3rem;flex:none;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.bar{height:6px;border-radius:9px;background:var(--surface-2);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:9px}
/* sell */
.sell{display:grid;gap:16px;grid-template-columns:1fr}
@media (min-width:900px){.sell{grid-template-columns:minmax(0,1fr) 360px;align-items:start}}
.tilegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
@media (min-width:600px){.tilegrid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}}
.ptile{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:0;text-align:left;display:flex;flex-direction:column;overflow:hidden;min-width:0;transition:transform .08s}
.ptile:active{transform:scale(.97)}
.ptile .pic{aspect-ratio:4/3;max-width:100%;background:var(--surface-2);display:grid;place-items:center;font-size:2.2rem;overflow:hidden}
.ptile .pic img{width:100%;height:100%;object-fit:cover}
.ptile .meta{padding:8px 10px 10px;min-width:0}
.ptile .nm{font-weight:600;font-size:.9rem;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em}
.ptile .pr{font-family:var(--font-num);font-weight:700;color:var(--gold)}
.ptile .st{font-size:.75rem;color:var(--muted)}
.ptile .qty{position:absolute;top:6px;right:6px;background:var(--accent);color:var(--accent-ink);border-radius:999px;min-width:26px;height:26px;padding:0 7px;display:grid;place-items:center;font-weight:700;font-family:var(--font-num);font-size:.85rem}
.ptile.dim{opacity:.5}
.cartpanel{position:sticky;top:20px}
.cartline{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.cartline:first-child{border-top:0}
.cartline .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stepper button{border:0;background:var(--surface-2);width:34px;height:34px;font-size:1.1rem;font-weight:700}
.stepper span{min-width:34px;text-align:center;font-family:var(--font-num);font-weight:600}
.totals{display:flex;flex-direction:column;gap:4px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.totals .row{justify-content:space-between}
.grand{font-size:1.3rem;font-weight:700;font-family:var(--font-num)}
.cartbar{position:fixed;left:0;right:0;z-index:19;bottom:calc(62px + env(safe-area-inset-bottom,0px));padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-bottom:10px}
.cartbar button{width:100%;display:flex;justify-content:space-between;align-items:center;background:var(--accent);color:var(--accent-ink);border:0;border-radius:14px;padding:13px 18px;font-weight:700;box-shadow:var(--shadow)}
@media (min-width:900px){.cartbar{display:none}}
.scanrow{display:flex;gap:8px;flex-wrap:wrap}
/* products */
.ptable{width:100%;border-collapse:collapse}
.ptable th{text-align:left;font-size:.78rem;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.ptable td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.ptable td.n{font-family:var(--font-num);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.ptable th.n{text-align:right}
.ptable tr:last-child td{border-bottom:0}
.tablewrap{overflow-x:auto}
.pcards{display:flex;flex-direction:column}
@media (min-width:760px){.pcards{display:none}}
.ptable-wrap{display:none}
@media (min-width:760px){.ptable-wrap{display:block}}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:600}
/* sheet */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(10,18,13,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:18px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));animation:up .18s ease-out}
@media (min-width:700px){.overlay{align-items:center}.sheet{border-radius:18px;padding-bottom:18px}}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.ptile{transition:none}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.photo-pick{display:flex;gap:12px;align-items:center}
.photo-pick .thumb{width:72px;height:72px;font-size:2rem}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--surface);padding:9px;font-weight:600}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
video.scan{width:100%;border-radius:12px;background:#000;aspect-ratio:4/3;object-fit:cover}
/* shop */
.shophead{background:var(--accent);color:var(--accent-ink);border-radius:var(--r);padding:20px;margin-bottom:14px}
.shophead h1{font-size:1.6rem}
.shophead p{margin:4px 0 0;opacity:.85}
.shopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.sitem{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.sitem .pic{aspect-ratio:1;max-width:100%;background:var(--surface-2);display:grid;place-items:center;font-size:2.6rem;overflow:hidden}
.sitem .pic img{width:100%;height:100%;object-fit:cover}
.sitem .body{padding:10px;display:flex;flex-direction:column;gap:6px;flex:1}
.sitem .nm{font-weight:600;line-height:1.25}
.sitem .foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:6px}
.wa{position:sticky;bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:5;box-shadow:var(--shadow);background:#1F9D55;color:#fff;border:0;border-radius:14px;padding:13px 18px;font-weight:700;display:flex;justify-content:space-between;align-items:center;text-decoration:none;gap:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center}
@media (min-width:900px){.toast{bottom:32px}.wa{bottom:16px}}
.setup{display:grid;gap:14px;grid-template-columns:1fr;max-width:760px}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div id="sheetRoot"></div>
<div id="toastRoot"></div>
<script>
"use strict";
/* ---------- icons ---------- */
const I = {
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>',
  sell:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.6 12.2a1 1 0 0 0 1 .8h9.6a1 1 0 0 0 1-.8L21 7H6"/></svg>',
  box:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>',
  money:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="13" rx="2"/><path d="M2 10h20"/><path d="M16 15h2"/></svg>',
  shop:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l1.5-5h15L21 9"/><path d="M3 9a3 3 0 0 0 6 0 3 3 0 0 0 6 0 3 3 0 0 0 6 0"/><path d="M5 12v8h14v-8"/><path d="M10 20v-4h4v4"/></svg>',
  gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',

/* ---------- storage (IndexedDB, falls back to memory) ---------- */
const DB = {
  db:null,
  open(){ return new Promise(res=>{ try{ const r=indexedDB.open("dokan-khata",1);
    r.onupgradeneeded=()=>{const d=r.result;["products","sales","entries","meta"].forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:"id"})})};
    r.onsuccess=()=>{DB.db=r.result;res(true)}; r.onerror=()=>res(false); r.onblocked=()=>res(false);
    setTimeout(()=>res(false),2500); }catch(e){res(false)} }); },
  all(s){ if(!this.db) return Promise.resolve([]); return new Promise(res=>{ try{ const q=this.db.transaction(s).objectStore(s).getAll(); q.onsuccess=()=>res(q.result||[]); q.onerror=()=>res([]);}catch(e){res([])} }); },
  put(s,o){ if(!this.db) return; try{ this.db.transaction(s,"readwrite").objectStore(s).put(o);}catch(e){} },
  del(s,id){ if(!this.db) return; try{ this.db.transaction(s,"readwrite").objectStore(s).delete(id);}catch(e){} },
  clear(s){ if(!this.db) return; try{ this.db.transaction(s,"readwrite").objectStore(s).clear();}catch(e){} }
};
const saveMeta = () => DB.put("meta",S.meta);

function periodStart(p){ const n=new Date(); let s=new Date(n.getFullYear(),n.getMonth(),n.getDate());
  if(p==="7") s.setDate(s.getDate()-6); else if(p==="30") s.setDate(s.getDate()-29); else if(p==="month") s=new Date(n.getFullYear(),n.getMonth(),1); return s.getTime(); }
function stats(from){
  const ss=S.sales.filter(s=>s.at>=from), es=S.entries.filter(e=>e.at>=from);
  const sales=sum(ss,s=>s.total), cogs=sum(ss,s=>sum(s.items,i=>i.qty*i.cost));
  // Stock purchases are already counted through product cost (cogs), so they are kept out of expenses to avoid counting them twice.
  const exp=sum(es.filter(e=>e.type==="expense"&&e.category!=="purchase"),e=>e.amount), buy=sum(es.filter(e=>e.type==="expense"&&e.category==="purchase"),e=>e.amount), inc=sum(es.filter(e=>e.type==="income"),e=>e.amount);
  return {ss,count:ss.length,sales,profit:sales-cogs,exp,buy,inc,net:sales-cogs+inc-exp};
}
function vHome(){

  const tops=Object.values(top).sort((a,b)=>b.amt-a.amt).slice(0,5); const tmax=tops[0]?.amt||1;

      </section>
    </div>

        ${low.length?`<div class="list" style="margin-top:6px">${low.slice(0,7).map(p=>`<button class="li" data-act="restock" data-id="${p.id}"><div class="thumb">${pic(p)}</div><div class="grow"><b>${esc(pname(p))}</b><span class="small muted">${t("restock")} +</span></div><span class="pill ${stockState(p)} num">${p.stock<=0?t("outStock"):N(p.stock)+" "+t(p.unit||"pcs")}</span></button>`).join("")}</div>`:`<div class="empty">${t("allGood")}</div>`}
      </section>

        <span class="muted">${t("stockValue")}</span><b class="num">${M(stockVal)}</b>

      </div></section>
      <a class="card" href="#money" data-act="goDue" style="text-decoration:none;color:inherit"><div class="kv"><span class="muted">${t("dueTotal")}</span><b class="num" style="color:var(--warn)">${M(dueAmt)}</b></div></a>
    </div>

function chart(){
  const days = S.period==="30"?30 : S.period==="month"? new Date().getDate() : S.period==="today"?7:7;
  const W=640,H=220,pl=52,pr=8,pt=12,pb=28; const iw=W-pl-pr, ih=H-pt-pb;
  const data=[]; for(let i=days-1;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); const k=dayKey(d); data.push({k,d:d.getTime(),v:sum(S.sales.filter(s=>dayKey(s.at)===k),s=>s.total)}); }
  const mx=Math.max(...data.map(d=>d.v),1); const step=Math.pow(10,Math.floor(Math.log10(mx))); const top=Math.ceil(mx/step)*step||1;
  const bw=iw/days; let g="";
  for(let j=0;j<=3;j++){ const val=top*j/3, y=pt+ih-ih*j/3; g+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/><text x="${pl-8}" y="${y+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="var(--font-num)">${esc(N(Math.round(val)))}</text>`; }
  const every=days>14?5:1;
  data.forEach((d,i)=>{ const h=ih*d.v/top, x=pl+i*bw+bw*.18, w=bw*.64, last=i===days-1;
    g+=`<rect x="${x.toFixed(1)}" y="${(pt+ih-h).toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(h,0).toFixed(1)}" rx="3" fill="${last?"var(--gold)":"var(--accent)"}" opacity="${last?1:.85}"><title>${esc(fdate(d.d))}: ${esc(M(d.v))}</title></rect>`;
    if((days-1-i)%every===0) g+=`<text x="${(pl+i*bw+bw/2).toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="var(--font-body)">${esc(days>7?fdate(d.d,{day:"numeric"}):fdate(d.d,{weekday:"short"}))}</text>`; });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t("salesChart"))}">${g}</svg>`;
}

function addToCart(id){
  const p=S.products.find(x=>x.id===id); if(!p) return;
  const c=S.cart.find(x=>x.pid===id); const q=(c?c.qty:0)+1;
  if(q>p.stock){ toast(t("onlyLeft",{n:N(Math.max(0,p.stock))})); return; }
  if(c) c.qty=q; else S.cart.push({pid:id,qty:1,price:p.price});
  refreshCart();
}
function completeSale(){
  if(!S.cart.length) return;
  if(S.co.method==="due"&&!S.co.customer.trim()){ toast(t("needCustomer")); $("#coCust")?.focus(); return; }
  const tt=cartTotals(), at=Date.now();
  const items=S.cart.map(c=>{const p=S.products.find(x=>x.id===c.pid); return {pid:c.pid,name:p.name,nameBn:p.nameBn||"",qty:c.qty,price:c.price,cost:+p.cost||0};});
  const sale={id:uid(),at,items,subtotal:tt.sub,discount:tt.disc,total:tt.total,method:S.co.method,customer:S.co.customer.trim(),note:"",paidAt:S.co.method==="due"?null:at};
  S.sales.push(sale); DB.put("sales",sale);
  items.forEach(i=>{const p=S.products.find(x=>x.id===i.pid); p.stock=Math.round((p.stock-i.qty)*1000)/1000; DB.put("products",p);});
  S.cart=[]; S.co={discount:"",method:"cash",customer:"",note:""};
  if(S.sheet==="cart") closeSheet();
  render(); toast(t("saleSaved")+" · "+M(sale.total));
}

function openSheet(name,html){ S.sheet=name; $("#sheetRoot").innerHTML=`<div class="overlay" data-act="overlay"><div class="sheet" role="dialog" aria-modal="true" id="sheetBody">${html}</div></div>`; }
function closeSheet(){ if(S.scanStream){S.scanStream.getTracks().forEach(x=>x.stop());S.scanStream=null;} S.sheet=null; S.armed=null; $("#sheetRoot").innerHTML=""; }
let toastT; function toast(m){ $("#toastRoot").innerHTML=`<div class="toast" role="status">${esc(m)}</div>`; clearTimeout(toastT); toastT=setTimeout(()=>$("#toastRoot").innerHTML="",2600); }

async function openScanner(target){
  S.scanTarget=target==="form"?"form":null;
  if(!("BarcodeDetector" in window)||!navigator.mediaDevices?.getUserMedia){ toast(t("noCamScan")); return; }
  const prev=S.sheet==="product"?$("#sheetBody").innerHTML:null;
  try{
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});
    const det=new BarcodeDetector();
    const holder=document.createElement("div"); holder.className="overlay"; holder.style.zIndex=55;
    holder.innerHTML=`<div class="sheet"><div class="sheet-head"><h2>${t("camera")}</h2><button class="iconbtn" id="scanClose">${I.x}</button></div><video class="scan" playsinline autoplay muted></video></div>`;
    document.body.appendChild(holder); const v=holder.querySelector("video"); v.srcObject=stream;
    let done=false; const stop=()=>{done=true;stream.getTracks().forEach(x=>x.stop());holder.remove();};
    holder.querySelector("#scanClose").onclick=stop;
    const loop=async()=>{ if(done) return; try{ const r=await det.detect(v); if(r&&r[0]){ stop(); handleBarcode(r[0].rawValue); return; } }catch(e){} setTimeout(loop,250); };
    v.onloadedmetadata=loop;
  }catch(e){ toast(t("camDenied")); }
}
function resizeImage(file){ return new Promise(res=>{ const r=new FileReader(); r.onload=()=>{ const img=new Image(); img.onload=()=>{ const s=320, sc=Math.min(1,s/Math.max(img.width,img.height)); const c=document.createElement("canvas"); c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc); c.getContext("2d").drawImage(img,0,0,c.width,c.height); res(c.toDataURL("image/jpeg",.78)); }; img.onerror=()=>res(""); img.src=r.result; }; r.onerror=()=>res(""); r.readAsDataURL(file); }); }

    const s=S.sales.find(x=>x.id===el.dataset.id); s.items.forEach(i=>{const p=S.products.find(x=>x.id===i.pid); if(p){p.stock=Math.round((p.stock+i.qty)*1000)/1000; DB.put("products",p);}});
    S.sales=S.sales.filter(x=>x!==s); DB.del("sales",s.id); closeSheet(); render(); toast(t("stockRestored")); },

  etype(el){ S.edit.type=el.dataset.v; document.querySelectorAll("#eSeg button").forEach(b=>b.classList.toggle("on",b===el)); $("#eCat").innerHTML=catOpts(el.dataset.v); },

  sinc(el){ const p=S.products.find(x=>x.id===el.dataset.id); const q=(S.shopCart[p.id]||0)+1; if(q>p.stock){toast(t("onlyLeft",{n:N(p.stock)}));return;} S.shopCart[p.id]=q; render(); },

  exportJson(){ download("dokan-khata-backup-"+dayKey(Date.now())+".json",JSON.stringify({app:"dokan-khata",v:1,meta:S.meta,products:S.products,sales:S.sales,entries:S.entries}),"application/json"); },
  exportCsv(){ const q=v=>'"'+String(v??"").replace(/"/g,'""')+'"';
    const rows=[["date","time","items","total","discount","payment","customer","profit"]].concat([...S.sales].sort((a,b)=>a.at-b.at).map(s=>[dayKey(s.at),new Date(s.at).toTimeString().slice(0,5),s.items.map(i=>i.name+" x"+i.qty).join("; "),s.total,s.discount,s.method,s.customer,s.total-sum(s.items,i=>i.qty*i.cost)]));
    download("sales-"+dayKey(Date.now())+".csv","﻿"+rows.map(r=>r.map(q).join(",")).join("\n"),"text/csv"); },
  close(){ closeSheet(); },
  overlay(el,ev){ if(ev.target===el) closeSheet(); }
};
document.addEventListener("click",ev=>{
  const el=ev.target.closest("[data-act]"); if(!el) return;
  const fn=A[el.dataset.act]; if(!fn) return;
  if(el.tagName==="BUTTON"&&el.type!=="submit") ev.preventDefault();
  if(el.dataset.act!=="overlay"&&!/^(delProduct|delSale|delEntry|reset)$/.test(el.dataset.act)) S.armed=null;
  fn(el,ev);
});
document.addEventListener("submit",ev=>{ ev.preventDefault(); const f=ev.target;
  if(f.id==="pForm") saveProduct(f); else if(f.id==="rForm") saveRestock(f); else if(f.id==="eForm") saveEntry(); });
document.addEventListener("input",ev=>{
  const el=ev.target;
  if(el.id==="q"){ S.q=el.value; const g=$("#grid"); if(!g) return;
    if(S.view==="sell") g.innerHTML=sellGrid(); else if(S.view==="products") render(), $("#q").focus(), $("#q").setSelectionRange(S.q.length,S.q.length); else if(S.view==="shop") { render(); const q=$("#q"); q.focus(); q.setSelectionRange(S.q.length,S.q.length);} return; }
  if(el.dataset.co){ S.co[el.dataset.co]=el.value; if(el.dataset.co==="discount"){ const tt=cartTotals(); ["#coTotal","#coTotal2"].forEach(s=>{const x=$(s); if(x) x.textContent=M(tt.total)}); renderCartbar(); } return; }
  if(el.dataset.meta){ S.meta[el.dataset.meta]=el.type==="checkbox"?el.checked:el.value; saveMeta(); document.querySelectorAll(".brand-text b").forEach(b=>b.textContent=S.meta.shopName||"Dokan Khata"); }
});
document.addEventListener("change",async ev=>{
  const el=ev.target;
  if(el.id==="pPhoto"&&el.files[0]){ S.edit.photo=await resizeImage(el.files[0]); if(S.edit.photo) $("#pPhotoPrev").innerHTML=`<img src="${S.edit.photo}" alt="">`; }
  if(el.id==="importFile"&&el.files[0]){ try{ const d=JSON.parse(await el.files[0].text()); if(d.app!=="dokan-khata"||!Array.isArray(d.products)) throw 0;
      wipe(); S.products=d.products; S.sales=d.sales||[]; S.entries=d.entries||[]; S.meta=Object.assign(S.meta,d.meta||{},{id:"settings"});
      S.products.forEach(p=>DB.put("products",p)); S.sales.forEach(s=>DB.put("sales",s)); S.entries.forEach(e=>DB.put("entries",e)); saveMeta(); shell(); render(); toast(t("imported"));
    }catch(e){ toast(t("badFile")); } el.value=""; }
});
document.addEventListener("keydown",ev=>{
  if(ev.key==="Enter"&&ev.target.id==="scanInput"){ ev.preventDefault(); handleBarcode(ev.target.value); ev.target.value=""; }
  if(ev.key==="Escape"&&S.sheet) closeSheet();
});
const VIEWS=["home","sell","products","money","shop","setup"];
function route(){ const h=location.hash.replace("#",""); S.view=VIEWS.includes(h)?h:"home"; S.q=""; S.cat=""; S.armed=null; if(S.sheet) closeSheet(); render(); window.scrollTo(0,0); }
addEventListener("hashchange",route);
let wasWide=wide(); addEventListener("resize",()=>{ const w=wide(); if(w!==wasWide){ wasWide=w; if(S.sheet==="cart") closeSheet(); if(S.view==="sell") render(); } });

/* ---------- start ---------- */
(async function start(){
  const ok=await DB.open();
  if(ok){ const [p,s,e,m]=await Promise.all(["products","sales","entries","meta"].map(x=>DB.all(x)));
    S.products=p; S.sales=s; S.entries=e; const st=m.find(x=>x.id==="settings"); if(st) S.meta=Object.assign(S.meta,st); }
  if(!S.products.length&&!S.sales.length&&!S.meta.shopName&&!S.meta.seeded){ seed(); S.meta.seeded=true; saveMeta(); }
  shell(); route();
})();
</script>
