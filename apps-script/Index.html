<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Store Flow</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Hind+Siliguri:wght@400;500;600;700&display=swap">
<style>
/* Layout: ledger-style app shell. Side rail on wide screens, bottom tab bar on phones. */
:root{
  --bg:#0A1712; --side:#0C1B15; --surface:#10241B; --surface-2:#163024; --surface-3:#1C3A2C; --ink:#EAF6EF; --muted:#9BB8A8; --line:#1C3628; --line-2:#284A39; --accent-line:#2F7A55;
  --accent:#3DDC97; --accent-ink:#05281A; --accent-soft:rgba(61,220,151,.14); --accent-deep:#1E9E63; --mint-pale:#A8F0CB;
  --gold:#F5B93A; --gold-soft:rgba(245,185,58,.15); --marigold:#F5B93A;
  --danger:#F26B5E; --danger-soft:rgba(242,107,94,.15); --danger-chip:#6B2420; --warn:#F5B93A; --warn-soft:rgba(245,185,58,.15); --ok:#3DDC97;
  --shadow:0 1px 0 rgba(255,255,255,.02) inset,0 12px 30px -18px rgba(0,0,0,.7);
  --font-body:"Hind Siliguri",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-head:"Poppins","Hind Siliguri",system-ui,sans-serif;
  --font-num:"Poppins","Hind Siliguri",system-ui,sans-serif;
  --r:18px; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font-body);-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--font-num);margin:0;line-height:1.2;text-wrap:balance}
h1{font-size:1.5rem} h2{font-size:1.1rem} h3{font-size:.95rem}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.app{display:grid;grid-template-columns:1fr;min-height:100%}
/* side rail */
.side{display:none}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.brand-mark{width:34px;height:34px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-family:var(--font-num);flex:none}
.brand-text{min-width:0}
.brand-text b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:1rem;line-height:1.2}
.brand-text span{font-size:.75rem;color:var(--muted)}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;height:38px;min-width:38px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.iconbtn svg{width:18px;height:18px}
.main{min-width:0;width:100%;max-width:1240px;margin:0 auto;padding-block:16px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.bottomnav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 7px;color:var(--muted);text-decoration:none;font-size:.72rem;font-weight:500}
.bottomnav a svg{width:22px;height:22px}
.bottomnav a.on{color:var(--accent)}
.bottomnav a.sellbtn svg{background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:5px;width:34px;height:34px;margin-top:-14px;box-shadow:var(--shadow)}
@media (min-width:900px){
  .app{grid-template-columns:236px 1fr}
  .topbar,.bottomnav{display:none}
  body::before{background:var(--bg)}
  .side{display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;padding:20px 14px;padding-left:max(14px,env(safe-area-inset-left,0px));border-right:1px solid var(--line);background:var(--surface)}
  .side .brand{flex:none;margin:0 6px 18px}
  .side a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--ink);text-decoration:none;font-weight:500}
  .side a svg{width:20px;height:20px;color:var(--muted)}
  .side a:hover{background:var(--surface-2)}
  .side a.on{background:var(--accent-soft);color:var(--accent)}
  .side a.on svg{color:var(--accent)}
  .side .grow{flex:1}
  .main{padding-block:28px 48px}
}
/* generic */
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px}
.btn svg{width:18px;height:18px}
a.btn,a.iconbtn{color:var(--ink);text-decoration:none}
.btn.primary,a.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.danger.armed{background:var(--danger);color:var(--surface)}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;white-space:nowrap;font-weight:500;font-size:.9rem}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:1px 9px;font-size:.75rem;font-weight:600;white-space:nowrap}
.pill.low{background:var(--warn-soft);color:var(--warn)}
.pill.out{background:var(--danger-soft);color:var(--danger)}
.pill.ok{background:var(--accent-soft);color:var(--accent)}
.pill.gold{background:var(--gold-soft);color:var(--gold)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:.82rem;font-weight:600;color:var(--muted)}
.input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;min-height:42px}
.input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.search{position:relative;flex:1;min-width:180px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.search .input{padding-left:36px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.page-head p{margin:2px 0 0;color:var(--muted)}
.banner{background:var(--gold-soft);color:var(--ink);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}
.banner p{margin:0;min-width:0;flex:1 1 240px}
.empty{text-align:center;color:var(--muted);padding:28px 12px}
/* dashboard */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:14px}
@media (min-width:700px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.tile .lbl{font-size:.8rem;color:var(--muted);font-weight:600;letter-spacing:.02em}
.tile .val{font-family:var(--font-num);font-size:1.45rem;font-weight:700;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .sub{font-size:.78rem;color:var(--muted)}
.tile.hero{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tile.hero .lbl,.tile.hero .sub{color:inherit;opacity:.85}
.neg{color:var(--danger)}
.dash{display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:1000px){.dash{grid-template-columns:1.6fr 1fr}}
.chart svg{width:100%;height:auto;display:block}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);min-width:0}
.li:first-child{border-top:0}
.li .grow{flex:1;min-width:0}
.li .grow b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.li .amt{font-family:var(--font-num);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
button.li{background:none;border:0;border-top:1px solid var(--line);width:100%;text-align:left;padding:10px 4px}
button.li:first-child{border-top:0}
button.li:hover{background:var(--surface-2)}
.thumb{width:40px;height:40px;border-radius:9px;background:var(--surface-2);display:grid;place-items:center;font-size:1.3rem;flex:none;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.bar{height:6px;border-radius:9px;background:var(--surface-2);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:9px}
/* sell */
.sell{display:grid;gap:16px;grid-template-columns:1fr}
@media (min-width:900px){.sell{grid-template-columns:minmax(0,1fr) 360px;align-items:start}}
.tilegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
@media (min-width:600px){.tilegrid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}}
.ptile{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:0;text-align:left;display:flex;flex-direction:column;overflow:hidden;min-width:0;transition:transform .08s}
.ptile:active{transform:scale(.97)}
.ptile .pic{aspect-ratio:4/3;max-width:100%;background:var(--surface-2);display:grid;place-items:center;font-size:2.2rem;overflow:hidden}
.ptile .pic img{width:100%;height:100%;object-fit:cover}
.ptile .meta{padding:8px 10px 10px;min-width:0}
.ptile .nm{font-weight:600;font-size:.9rem;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em}
.ptile .pr{font-family:var(--font-num);font-weight:700;color:var(--gold)}
.ptile .st{font-size:.75rem;color:var(--muted)}
.ptile .qty{position:absolute;top:6px;right:6px;background:var(--accent);color:var(--accent-ink);border-radius:999px;min-width:26px;height:26px;padding:0 7px;display:grid;place-items:center;font-weight:700;font-family:var(--font-num);font-size:.85rem}
.ptile.dim{opacity:.5}
.cartpanel{position:sticky;top:20px}
.cartline{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.cartline:first-child{border-top:0}
.cartline .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stepper button{border:0;background:var(--surface-2);width:34px;height:34px;font-size:1.1rem;font-weight:700}
.stepper span{min-width:34px;text-align:center;font-family:var(--font-num);font-weight:600}
.totals{display:flex;flex-direction:column;gap:4px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.totals .row{justify-content:space-between}
.grand{font-size:1.3rem;font-weight:700;font-family:var(--font-num)}
.cartbar{position:fixed;left:0;right:0;z-index:19;bottom:calc(62px + env(safe-area-inset-bottom,0px));padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-bottom:10px}
.cartbar button{width:100%;display:flex;justify-content:space-between;align-items:center;background:var(--accent);color:var(--accent-ink);border:0;border-radius:14px;padding:13px 18px;font-weight:700;box-shadow:var(--shadow)}
@media (min-width:900px){.cartbar{display:none}}
.scanrow{display:flex;gap:8px;flex-wrap:wrap}
/* products */
.ptable{width:100%;border-collapse:collapse}
.ptable th{text-align:left;font-size:.78rem;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.ptable td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.ptable td.n{font-family:var(--font-num);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.ptable th.n{text-align:right}
.ptable tr:last-child td{border-bottom:0}
.tablewrap{overflow-x:auto}
.pcards{display:flex;flex-direction:column}
@media (min-width:760px){.pcards{display:none}}
.ptable-wrap{display:none}
@media (min-width:760px){.ptable-wrap{display:block}}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:600}
/* sheet */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(10,18,13,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:18px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));animation:up .18s ease-out}
@media (min-width:700px){.overlay{align-items:center}.sheet{border-radius:18px;padding-bottom:18px}}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.ptile{transition:none}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.photo-pick{display:flex;gap:12px;align-items:center}
.photo-pick .thumb{width:72px;height:72px;font-size:2rem}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--surface);padding:9px;font-weight:600}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
video.scan{width:100%;border-radius:12px;background:#000;aspect-ratio:4/3;object-fit:cover}
/* shop */
.shophead{background:var(--accent);color:var(--accent-ink);border-radius:var(--r);padding:20px;margin-bottom:14px}
.shophead h1{font-size:1.6rem}
.shophead p{margin:4px 0 0;opacity:.85}
.shopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.sitem{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.sitem .pic{aspect-ratio:1;max-width:100%;background:var(--surface-2);display:grid;place-items:center;font-size:2.6rem;overflow:hidden}
.sitem .pic img{width:100%;height:100%;object-fit:cover}
.sitem .body{padding:10px;display:flex;flex-direction:column;gap:6px;flex:1}
.sitem .nm{font-weight:600;line-height:1.25}
.sitem .foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:6px}
.wa{position:sticky;bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:5;box-shadow:var(--shadow);background:#1F9D55;color:#fff;border:0;border-radius:14px;padding:13px 18px;font-weight:700;display:flex;justify-content:space-between;align-items:center;text-decoration:none;gap:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center}
@media (min-width:900px){.toast{bottom:32px}.wa{bottom:16px}}
.lockic svg{width:14px;height:14px;vertical-align:-2px}
.lockic{margin-left:4px;color:var(--muted)}
.locked-card{position:relative;text-align:center;padding:24px 16px}
.lockwrap{display:grid;place-items:center;min-height:60vh}
.lockcard{max-width:520px;width:100%;padding:24px}
.lockbadge{width:52px;height:52px;border-radius:14px;background:var(--gold-soft);color:var(--gold);display:grid;place-items:center}
.lockbadge svg{width:26px;height:26px}
.plans{display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:860px){.plans{grid-template-columns:repeat(3,minmax(0,1fr))}}
.plan.yearly{margin-top:14px;position:relative;display:grid;gap:14px;align-items:center;border:1.5px solid var(--accent,#3DDC97)}
.yearly-compare{display:grid;gap:6px}
.ycrow{display:flex;justify-content:space-between;gap:12px;font-size:.95rem}
.ycrow s{opacity:.7}
.ycrow.save{color:var(--accent,#3DDC97);font-weight:700;border-top:1px dashed var(--line-2,rgba(255,255,255,.15));padding-top:6px}
@media (min-width:860px){.plan.yearly{grid-template-columns:1.1fr 1.3fr .8fr}}
.plan{display:flex;flex-direction:column;gap:10px;position:relative}
.plan.pop{border:2px solid var(--accent)}
.popbadge{position:absolute;top:14px;right:14px}
.price{font-family:var(--font-num);font-size:2rem;font-weight:700}
.feat{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;flex:1}
.feat li{display:flex;gap:8px;align-items:flex-start;line-height:1.35}
.feat li.off{color:var(--muted);opacity:.65}
.feat .tick{width:18px;flex:none;font-weight:700;color:var(--accent)}
.feat li.off .tick{color:var(--muted)}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.guide{list-style:none;margin:0;padding:0;display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:860px){.guide{grid-template-columns:1fr 1fr}}
.guide li{display:flex;gap:14px;align-items:flex-start}
.guide p{margin:4px 0 8px;color:var(--muted)}
.gnum{width:34px;height:34px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;flex:none}
.side .pill,.topbar .pill{text-decoration:none}
.gate{position:fixed;inset:0;z-index:80;background:var(--bg);overflow:auto;display:flex;justify-content:center;align-items:flex-start;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.gatecard{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);width:100%;max-width:720px;padding:22px;display:flex;flex-direction:column;gap:16px;margin:auto 0}
.termsbox{max-height:min(46vh,460px);overflow:auto;border:1px solid var(--line);border-radius:12px;padding:4px 16px;background:var(--bg)}
.terms{margin:0;padding-left:22px}
.terms li{padding:10px 0;border-bottom:1px solid var(--line)}
.terms li:last-child{border-bottom:0}
.terms h3{font-size:1rem;margin:0 0 2px}
.terms p{margin:0;color:var(--muted)}
.tourdots{display:flex;gap:6px}.tourdots span{flex:1;height:5px;border-radius:3px;background:var(--line)}.tourdots span.on{background:var(--accent)}
.tourico{width:52px;height:52px;flex:none;border-radius:16px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}.tourico svg{width:26px;height:26px}
.tourlist{font-size:1.02rem;gap:10px}
.timerbig{font-size:3rem;font-weight:700;color:var(--accent);line-height:1}
body.gated{overflow:hidden}
.scanbar{display:flex;align-items:center;gap:12px;background:var(--accent-soft);border:1px solid var(--accent);border-radius:12px;padding:10px 14px}
.scanbar .grow{flex:1;min-width:0}.scanbar .grow b{display:block}
.scanbar .dot{width:12px;height:12px;border-radius:50%;background:var(--accent);flex:none;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.75)}}
.scanlast{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;border-top:1px solid var(--line)}
.scanlast.flash{animation:flash .6s ease-out}
@keyframes flash{from{background:var(--accent-soft)}to{background:var(--surface)}}
@media (prefers-reduced-motion:reduce){.scanbar .dot,.scanlast.flash{animation:none}}
.setup{display:grid;gap:14px;grid-template-columns:1fr;max-width:760px}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px}
/* ===== Green dashboard theme ===== */
body{font-size:16px;background:var(--bg);background-image:radial-gradient(900px 500px at 85% -10%,rgba(46,204,135,.10),transparent 60%),radial-gradient(700px 500px at -10% 110%,rgba(46,204,135,.06),transparent 60%);background-attachment:fixed}
h1,h2,h3,.brand-text b{font-family:var(--font-head);font-weight:700;letter-spacing:-.01em}
h1{font-size:1.7rem} h2{font-size:1.12rem}
.muted{color:var(--muted)}
.topbar{background:rgba(11,26,20,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding-block:12px}
body::before{background:var(--bg)}
.brand-mark{width:44px;height:44px;border-radius:12px;background:linear-gradient(145deg,#3FE09A,#1FA86A);color:#06301D;box-shadow:0 6px 18px -6px rgba(46,204,135,.6)}
.brand-mark svg{width:24px;height:24px}
.brand-text b{font-size:1.08rem}
.brand-text span{font-size:.8rem}
.iconbtn{border-radius:999px;height:42px;min-width:42px;background:transparent;border:1px solid transparent;color:var(--ink);transition:background .2s,transform .15s;position:relative}
.iconbtn:hover{background:var(--surface-2)}
.iconbtn:active{transform:scale(.92)}
.iconbtn svg{width:22px;height:22px}
.iconbtn .dot{position:absolute;top:8px;right:9px;width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--bg)}
.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#1B8C7E,#13685E);color:#DFFBF2;font-weight:700;font-family:var(--font-head);text-decoration:none;flex:none;box-shadow:inset 0 0 0 2px rgba(255,255,255,.06);transition:transform .15s}
.avatar:active{transform:scale(.92)}
.card,.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card{padding:18px}
.btn{border-radius:12px;min-height:46px;padding:10px 18px;font-weight:600;background:var(--surface-2);border:1px solid var(--line-2);transition:transform .12s,background .2s,filter .2s,box-shadow .2s}
.btn:hover{background:var(--surface-3)}
.btn:active{transform:scale(.97)}
.btn.primary,a.btn.primary{background:linear-gradient(135deg,#3FE09A,#22B873);border-color:transparent;color:#05281A;box-shadow:0 8px 22px -10px rgba(46,204,135,.7)}
.btn.primary:hover{filter:brightness(1.07)}
.input{border-radius:12px;min-height:46px;background:var(--surface-2);border:1px solid var(--line-2);transition:border-color .2s,box-shadow .2s}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field label{color:var(--ink);font-size:.88rem}
.chip{background:transparent;border:1px solid var(--line-2);color:var(--ink);padding:8px 18px;font-weight:500;display:inline-flex;align-items:center;gap:8px;transition:background .25s,color .25s,transform .12s}
.chip svg{width:16px;height:16px}
.chip:hover{background:var(--surface-2)}
.chip:active{transform:scale(.95)}
.chip.on{background:var(--mint-pale);border-color:var(--mint-pale);color:#073A24;font-weight:700}
.seg{border-radius:999px;border:1px solid var(--line-2);background:var(--surface-2);padding:3px;gap:3px}
.seg button{border-radius:999px;background:transparent;min-height:38px;transition:background .25s,color .25s}
.seg button.on{background:var(--mint-pale);color:#073A24}
.pill.ok{background:var(--accent-soft);color:var(--accent)}
.pill.low,.pill.out{background:var(--danger-chip);color:#FFD9D4}
.pill.gold{background:var(--gold-soft);color:var(--gold)}
.banner{background:var(--surface-2);border:1px solid var(--line-2);border-left:4px solid var(--gold)}
/* header greeting */
.hello{position:relative;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:-4px 0 18px;min-height:150px}
.hello h1{font-size:clamp(1.45rem,3.2vw,2.2rem);line-height:1.15}
.hello p{margin:6px 0 14px;color:var(--muted);font-size:1.02rem}
.hello .chips{position:relative;z-index:1}
.hello-txt{min-width:0;position:relative;z-index:1}
.hello-art{position:absolute;right:-8px;top:-10px;width:min(46%,420px);height:auto;pointer-events:none;opacity:.95;-webkit-mask:linear-gradient(90deg,transparent,#000 30%);mask:linear-gradient(90deg,transparent,#000 30%)}
@media (max-width:640px){.hello{min-height:0}.hello-art{width:42%;top:-18px;right:-16px;opacity:.9}.hello h1{max-width:72%}.hello p{max-width:70%}}
/* stat tiles */
.tiles{gap:12px;margin-bottom:14px}
.tile{display:flex;gap:14px;align-items:flex-start;padding:16px;position:relative;overflow:hidden}
.tile .tico{width:44px;height:44px;flex:none;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.tile .tico svg{width:24px;height:24px}
.tile .tbody{min-width:0;flex:1}
.tile .lbl{font-size:.92rem;color:var(--ink);font-weight:500;letter-spacing:0;opacity:.92}
.tile .val{font-family:var(--font-head);font-size:1.55rem;font-weight:700;margin-top:2px}
.tile .sub{font-size:.82rem;color:var(--muted)}
.tile .up{color:var(--accent);font-weight:600}
.tile .down{color:var(--danger);font-weight:600}
.tile.hero{background:linear-gradient(135deg,#2BC983 0%,#169A5E 100%);border-color:rgba(255,255,255,.12);color:#F2FFF8;box-shadow:0 14px 34px -16px rgba(46,204,135,.75)}
.tile.hero .tico{background:rgba(4,40,25,.35);color:#E9FFF4}
.tile.hero .lbl,.tile.hero .sub{color:#E9FFF4;opacity:.95}
.tile.hero .up,.tile.hero .down{color:#F2FFF8}
.tile .tbody{position:relative;z-index:1}
.tile .spark{opacity:.55}
.tile .spark{position:absolute;right:12px;bottom:10px;width:40%;max-width:110px;height:48px;opacity:.95}
@media (max-width:1279px){.tile .spark{display:none}}
@media (max-width:520px){.tile{flex-direction:row;padding:14px;gap:10px}.tile .tico{width:38px;height:38px}.tile .val{font-size:1.3rem}}
.neg{color:var(--danger)}
/* cards */
.card h2{display:flex;align-items:center;gap:10px}
.card h2 .hico{display:grid;place-items:center;color:var(--accent)}
.card h2 .hico svg{width:22px;height:22px}
.card h2 .hint{font-family:var(--font-body);font-weight:400;font-size:.9rem;color:var(--muted)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.viewall{color:var(--accent);font-weight:600;font-size:.9rem;text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.viewall svg{width:16px;height:16px}
.chart .total{font-family:var(--font-head);font-weight:700;font-size:1.2rem}
.statusban{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:var(--r);text-decoration:none;color:#06301D;background:linear-gradient(135deg,#A8EDC9,#7ED9AC);transition:transform .15s}
.statusban:active{transform:scale(.98)}
.statusban svg{width:28px;height:28px;flex:none}
.statusban b{display:block;font-family:var(--font-head)}
.statusban span{font-size:.9rem;opacity:.85}
.statusban .grow{flex:1;min-width:0}
.statusban.warn{background:linear-gradient(135deg,#FFD98A,#F5B93A);color:#3A2600}
@media (min-width:900px){.statusban{display:none}}
.lowrow,.bestrow{display:flex;align-items:center;gap:12px;padding:10px 4px;border-top:1px solid var(--line);min-width:0;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;color:inherit;border-radius:0;transition:background .2s}
.lowrow:first-child,.bestrow:first-child{border-top:0}
.lowrow:hover{background:var(--surface-2)}
.lowrow .grow,.bestrow .grow{flex:1;min-width:0;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lowrow .chev{color:var(--muted);width:18px;height:18px;flex:none}
.rank{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.82rem;flex:none;color:#2B1B00;background:#8E9A94}
.rank.r1{background:#F2C14E}.rank.r2{background:#C9D1CD}.rank.r3{background:#E39B5B}
.thumb{border-radius:10px;background:var(--surface-2)}
.bestrow .sold{font-weight:600;white-space:nowrap}
.bigcard{display:flex;align-items:center;gap:14px;text-decoration:none;color:inherit;transition:transform .15s,border-color .2s}
.bigcard:hover{border-color:var(--line-2);transform:translateY(-1px)}
.bigcard .bico{width:46px;height:46px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.bigcard .bico svg{width:26px;height:26px}
.bigcard .grow{flex:1;min-width:0}
.bigcard .big{font-family:var(--font-head);font-size:1.5rem;font-weight:700;line-height:1.2}
.bigcard .chev{width:20px;height:20px;color:var(--muted)}
.bigcard.gold .big{color:var(--gold)}
/* quick actions */
.qa-title{display:flex;align-items:center;gap:8px;margin:20px 0 12px}
.qa-title svg{width:22px;height:22px;color:var(--accent)}
.qa{display:grid;gap:10px;grid-template-columns:repeat(4,minmax(0,1fr))}
.qa a,.qa button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:96px;padding:12px 6px;border-radius:16px;background:var(--surface);border:1px solid var(--line-2);color:var(--ink);font-weight:600;font-size:.9rem;text-align:center;line-height:1.2;text-decoration:none;transition:transform .15s,background .2s,border-color .2s}
.qa a:hover,.qa button:hover{background:var(--surface-2);border-color:var(--accent-line)}
.qa a:active,.qa button:active{transform:scale(.95)}
.qa svg{width:28px;height:28px;color:var(--accent)}
.qa .d-only{display:none}
@media (min-width:900px){
  .qa{grid-template-columns:1.1fr repeat(4,minmax(0,1fr))}
  .qa a,.qa button{flex-direction:row;min-height:58px;font-size:1rem;gap:12px}
  .qa svg{width:24px;height:24px;color:var(--ink)}
  .qa .qa-main{background:linear-gradient(135deg,#3FE09A,#22B873);color:#05281A;border-color:transparent;font-size:1.05rem}
  .qa .qa-main svg{color:#05281A}
  .qa .d-only{display:flex}.qa .m-only{display:none}
}
/* bottom nav */
.bottomnav{background:rgba(14,32,24,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);border-radius:22px 22px 0 0;padding-top:6px}
.bottomnav a,.bottomnav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px 8px;color:var(--ink);opacity:.85;text-decoration:none;font-size:.8rem;font-weight:500;background:none;border:0;transition:color .2s,opacity .2s}
.bottomnav a svg,.bottomnav button svg{width:26px;height:26px;padding:6px 18px;box-sizing:content-box;border-radius:14px;transition:background .25s,color .25s,transform .25s}
.bottomnav a.on{color:var(--accent);opacity:1;font-weight:700}
.bottomnav a.on svg{background:var(--mint-pale);color:#073A24}
.bottomnav a:active svg,.bottomnav button:active svg{transform:scale(.9)}
/* side rail */
@media (min-width:900px){
  .side{background:var(--side);border-right:1px solid var(--line);padding:22px 16px;gap:6px}
  .side .brand{margin:0 4px 22px}
  .side a{padding:12px 14px;border-radius:12px;color:var(--ink);font-weight:500;font-size:1.02rem;transition:background .2s,color .2s,transform .15s}
  .side a svg{width:22px;height:22px;color:var(--ink);opacity:.85}
  .side a:hover{background:var(--surface-2)}
  .side a.on{background:linear-gradient(135deg,#2BC983,#169A5E);color:#F2FFF8;font-weight:700;box-shadow:0 10px 24px -14px rgba(46,204,135,.8)}
  .side a.on svg{color:#F2FFF8;opacity:1}
  .side hr{border:0;border-top:1px solid var(--line);margin:10px 4px}
  .main{padding-block:26px 48px}
}
.plancard{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line-2);text-decoration:none;color:var(--ink);margin-bottom:10px}
.plancard .crown{width:34px;height:34px;border-radius:10px;background:rgba(242,193,78,.15);color:#F2C14E;display:grid;place-items:center;flex:none}
.plancard .crown svg{width:20px;height:20px}
.plancard b{display:block;font-family:var(--font-head)}
.plancard span{font-size:.78rem;color:var(--muted)}
.plancard .grow{flex:1;min-width:0}
.plancard .chev{width:18px;height:18px;color:var(--muted)}
.langtog{display:flex;align-items:center;gap:4px;border:1px solid var(--line-2);border-radius:999px;padding:4px 4px 4px 12px;background:var(--surface)}
.langtog svg{width:18px;height:18px;color:var(--muted);flex:none;margin-right:4px}
.langtog button{flex:1;border:0;background:none;border-radius:999px;padding:8px 10px;font-weight:600;color:var(--ink);transition:background .25s,color .25s}
.langtog button.on{background:var(--mint-pale);color:#073A24}
.deskbar{display:none}
@media (min-width:900px){.deskbar{display:flex;align-items:center;justify-content:flex-end;gap:12px;margin-bottom:6px}
  .deskbar .search{flex:0 1 340px}.deskbar .input{border-radius:999px;background:var(--surface)}}
/* products, sell, sheets */
.ptile{background:var(--surface);border-color:var(--line);border-radius:var(--r);transition:transform .15s,border-color .2s}
.ptile:hover{transform:translateY(-2px);border-color:var(--accent-line)}
.ptile:active{transform:scale(.95)}
.ptile .pic{background:var(--surface-2)}
.ptile .pr{color:var(--accent)}
.ptile .qty{background:var(--accent);color:#05281A;animation:pop .25s ease-out}
.stepper{border-color:var(--line-2)}.stepper button{background:var(--surface-2);color:var(--ink)}
.grand{color:var(--accent)}
.cartbar{bottom:calc(76px + env(safe-area-inset-bottom,0px))}
.cartbar button{background:linear-gradient(135deg,#3FE09A,#22B873);color:#05281A;border-radius:16px;animation:rise .3s cubic-bezier(.2,.7,.2,1)}
.bar i{background:linear-gradient(90deg,#22B873,#7EF0B8)}
.sheet{background:var(--surface);border-radius:24px 24px 0 0;animation:up .3s cubic-bezier(.2,.7,.2,1)}
.sheet::before{content:"";display:block;width:44px;height:5px;border-radius:9px;background:var(--line-2);margin:-6px auto 12px}
@media (min-width:700px){.sheet{border-radius:24px}.sheet::before{display:none}}
.overlay{background:rgba(2,10,6,.6);animation:fade .2s ease-out}
.toast{background:var(--mint-pale);color:#073A24;border-radius:14px;padding:12px 18px;animation:toast .3s cubic-bezier(.2,.9,.3,1.3)}
.morelist{display:flex;flex-direction:column}
.morelist a,.morelist button{display:flex;align-items:center;gap:14px;padding:14px 6px;border:0;border-top:1px solid var(--line);background:none;color:var(--ink);text-decoration:none;font-weight:500;font-size:1.02rem;text-align:left;width:100%}
.morelist a:first-child{border-top:0}
.morelist svg{width:22px;height:22px;color:var(--accent)}
.plan.pop{border:2px solid var(--accent)}
.price{color:var(--accent)}
.shophead{background:linear-gradient(135deg,#2BC983,#169A5E);color:#F2FFF8}
.gnum,.tourico,.lockbadge{background:var(--accent-soft);color:var(--accent)}
.tourdots span.on{background:var(--accent)}
.timerbig{color:var(--accent)}
.gatecard{background:var(--surface);border:1px solid var(--line);border-radius:24px;animation:rise .35s cubic-bezier(.2,.7,.2,1)}
.gate{background:var(--bg)}
.termsbox{background:var(--surface-2)}
/* motion */
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes toast{from{opacity:0;transform:translate(-50%,16px) scale(.9)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.hello-art{animation:floaty 6s ease-in-out infinite}
.main.enter>*{animation:rise .4s cubic-bezier(.2,.7,.2,1) both}
.main.enter>*:nth-child(2){animation-delay:.05s}.main.enter>*:nth-child(3){animation-delay:.1s}.main.enter>*:nth-child(4){animation-delay:.15s}.main.enter>*:nth-child(5){animation-delay:.2s}.main.enter>*:nth-child(6){animation-delay:.25s}
.main.enter .tiles>*,.main.enter .qa>*,.main.enter .tilegrid>*{animation:rise .45s cubic-bezier(.2,.7,.2,1) both}
.main.enter .tiles>*:nth-child(2),.main.enter .qa>*:nth-child(2){animation-delay:.06s}
.main.enter .tiles>*:nth-child(3),.main.enter .qa>*:nth-child(3){animation-delay:.12s}
.main.enter .tiles>*:nth-child(4),.main.enter .qa>*:nth-child(4){animation-delay:.18s}
.main.enter .qa>*:nth-child(5){animation-delay:.24s}
.main.enter .chart .barr{transform-box:fill-box;transform-origin:50% 100%;animation:grow .7s cubic-bezier(.2,.7,.2,1) both .15s}
.scanrow>.search{flex:1 1 100%}
.statusban.always{display:flex!important}
@media (max-width:520px){.topbar .brand-text span{display:none}}
.seg-wrap{flex-wrap:wrap;border-radius:16px}.seg-wrap button{flex:1 1 auto;padding:8px 12px}
.sharebox{background:var(--surface-2);border:1px solid var(--line-2);border-radius:14px;padding:12px 14px}
.sharebox .btn{flex:1 1 140px}
.wa-btn{background:#1FAF5A!important;border-color:#1FAF5A!important;color:#fff!important}
.steps3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.steps3>div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.82rem;color:var(--muted);text-align:center}
.steps3 span{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line-2);font-weight:700}
.steps3>div.on{color:var(--ink);font-weight:600}.steps3>div.on span{background:var(--accent);color:#05281A;border-color:transparent}
.bottomnav{grid-template-columns:repeat(6,1fr)}
.bottomnav a svg,.bottomnav button svg{padding:6px 12px}
@media (max-width:380px){.bottomnav a,.bottomnav button{font-size:.7rem}.bottomnav a svg,.bottomnav button svg{padding:5px 8px}}
@media (min-width:900px){.qa{grid-template-columns:1.1fr repeat(5,minmax(0,1fr))}}
.scanrow .btn{flex:1 1 140px;padding:10px 12px}
.deskwrap{display:none}
.d-qa{display:none}
@media (min-width:900px){.deskwrap{display:block;padding-bottom:0!important}.deskwrap+.main{padding-top:4px}.m-qa{display:none}.d-qa{display:block}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<body>
<div class="app" id="app"></div>
<div id="gateRoot"></div>
<div id="sheetRoot"></div>
<div id="toastRoot"></div>
<script>
/* show unexpected errors on screen instead of a blank page */
(function(){ function show(m){ try{ var d=document.getElementById("errBox"); if(!d){ d=document.createElement("pre"); d.id="errBox"; d.style.cssText="position:fixed;left:8px;right:8px;bottom:8px;z-index:99;background:#FBE3DF;color:#7A1F14;border:1px solid #B3372A;border-radius:10px;padding:10px;font:12px/1.4 monospace;white-space:pre-wrap;max-height:40%;overflow:auto"; document.body.appendChild(d);} d.textContent+=m+"\n"; }catch(e){} }
  window.addEventListener("error",function(e){ show("Error: "+(e.message||e)+(e.lineno?" (line "+e.lineno+")":"")); });
  window.addEventListener("unhandledrejection",function(e){ show("Error: "+((e.reason&&(e.reason.stack||e.reason.message))||e.reason)); });
})();
</script>
<script>
"use strict";
/* ---------- icons ---------- */
const I = {
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>',
  sell:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.6 12.2a1 1 0 0 0 1 .8h9.6a1 1 0 0 0 1-.8L21 7H6"/></svg>',
  box:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>',

/* ---------- storage (IndexedDB, falls back to memory) ---------- */
const DB = {
  db:null,
  open(){ return new Promise(res=>{ try{ const r=indexedDB.open("dokan-khata",2);
    r.onupgradeneeded=()=>{const d=r.result;["products","sales","entries","orders","meta"].forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:"id"})})};
    r.onsuccess=()=>{DB.db=r.result;res(true)}; r.onerror=()=>res(false); r.onblocked=()=>res(false);
    setTimeout(()=>res(false),2500); }catch(e){res(false)} }); },
  all(s){ if(!this.db) return Promise.resolve([]); return new Promise(res=>{ setTimeout(()=>res([]),2500); try{ const q=this.db.transaction(s).objectStore(s).getAll(); q.onsuccess=()=>res(q.result||[]); q.onerror=()=>res([]);}catch(e){res([])} }); },
  put(s,o){ Sync.push({op:"put",store:s,obj:o}); if(!this.db) return; try{ this.db.transaction(s,"readwrite").objectStore(s).put(o);}catch(e){} },
  del(s,id){ Sync.push({op:"del",store:s,id}); if(!this.db) return; try{ this.db.transaction(s,"readwrite").objectStore(s).delete(id);}catch(e){} },
  clear(s){ Sync.push({op:"clear",store:s}); if(!this.db) return; try{ this.db.transaction(s,"readwrite").objectStore(s).clear();}catch(e){} }
};
/* ---------- Google Apps Script bridge (only active when served from Apps Script) ---------- */
const GAS = !!(window.google && google.script && google.script.run);
const gs = (fn,...args) => new Promise((res,rej)=>{ google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...args); });
const Sync = {
  q:[], timer:null, busy:false, state:"idle",
  on(){ return GAS && !!S.auth && !S.meta.sample && !S.noSync && ((S.access&&S.access.exp>=Date.now()) || inDemo()); },
  load(){ try{ this.q=JSON.parse(localStorage.getItem("dk-queue")||"[]"); }catch(e){ this.q=[]; } },
  keep(){ try{ localStorage.setItem("dk-queue",JSON.stringify(this.q)); }catch(e){} },
  push(op){ if(S.noSync||!this.on()) return; this.q.push(op); this.keep(); this.later(1200); },
  later(ms){ clearTimeout(this.timer); this.timer=setTimeout(()=>this.flush(),ms); },
  async flush(){
    if(this.busy||!this.q.length||!this.on()) return;
    this.busy=true; this.state="saving"; syncLabel();
    const batch=this.q.slice(0,40);
    try{ await gs("saveBatch",S.auth.token,batch); this.q.splice(0,batch.length); this.keep(); this.state=this.q.length?"saving":"saved"; }
    catch(e){ this.state="waiting"; this.busy=false; syncLabel(); this.later(15000); return; }
    this.busy=false; syncLabel(); if(this.q.length) this.later(200);
  },
  async pull(){
    if(!GAS||!S.auth) return;
    let d; try{ d=await gs("loadAll",S.auth.token); }catch(e){ return; }
    d.orders=d.orders||[]; const has=d.products.length||d.sales.length||d.entries.length||d.orders.length;
    if(has){
      ["products","sales","entries","orders"].forEach(st=>{ DB.clear(st); S[st]=d[st]; d[st].forEach(o=>DB.put(st,o)); });
      const m=(d.meta||[]).find(x=>x.id==="settings");
      if(m){ const keep={acct:S.meta.acct,paySent:S.meta.paySent,shopName:S.meta.shopName,lang:S.meta.lang,access:S.meta.access,demoStart:S.meta.demoStart,termsOk:S.meta.termsOk,guideSeen:S.meta.guideSeen,scanMode:S.meta.scanMode,scanSound:S.meta.scanSound}; S.meta=Object.assign(S.meta,m,keep); }
      S.meta.sample=false; DB.put("meta",S.meta); S.cart=[]; shell(); render();
    } else if(!S.meta.sample && (S.products.length||S.sales.length||S.entries.length)){
      // first time online with this code: upload what is on the device
      S.products.forEach(o=>this.q.push({op:"put",store:"products",obj:o}));
      S.sales.forEach(o=>this.q.push({op:"put",store:"sales",obj:o}));
      S.entries.forEach(o=>this.q.push({op:"put",store:"entries",obj:o}));
      S.orders.forEach(o=>this.q.push({op:"put",store:"orders",obj:o}));
      this.q.push({op:"put",store:"meta",obj:S.meta}); this.keep(); this.flush();
    }
  }
};

const b64u={
  dec:s=>Uint8Array.from(atob(s.replace(/-/g,"+").replace(/_/g,"/")+"=".repeat((4-s.length%4)%4)),c=>c.charCodeAt(0))
};
async function verifyCode(raw){
  try{
    let code=String(raw||"").trim(); const m=code.match(/code=([^&\s#]+)/); if(m) code=decodeURIComponent(m[1]);
    if(!code.includes(".")){ if(!GAS) return null; try{ return await gs("checkCode",code); }catch(e){ return S.access&&S.access.code===code.toUpperCase()?S.access:null; } }
    const [p,s]=code.split("."); if(!p||!s) return null;
    const key=await crypto.subtle.importKey("jwk",CONFIG.publicKey,{name:"ECDSA",namedCurve:"P-256"},false,["verify"]);
    const ok=await crypto.subtle.verify({name:"ECDSA",hash:"SHA-256"},key,b64u.dec(s),b64u.dec(p)); if(!ok) return null;
    const d=JSON.parse(new TextDecoder().decode(b64u.dec(p))); if(!TIERS[d.t]||!d.e) return null;
    return {id:d.i,biz:d.b||"",tier:d.t,exp:d.e,code};
  }catch(e){ return null; }
}

const CHANNELS=[["facebook","📘"],["instagram","📷"],["whatsapp","💬"],["phone","📞"],["walkin","🏪"]];
const COURIERS=["Pathao","Steadfast","RedX","Paperfly","eCourier","Sundarban","own","other"];

const oItemsTotal=o=>sum(o.lines||[],l=>l.qty*l.price);
const oTotal=o=>oItemsTotal(o)+(+o.delivery||0);
const oDueAmt=o=>Math.max(0,oTotal(o)-(+o.advance||0));
const lineName=l=>S.meta.lang==="bn"&&l.nameBn?l.nameBn:l.name;
const startOfDay=ts=>{ const d=new Date(ts); d.setHours(0,0,0,0); return d.getTime(); };
function preWhen(o){ const d=Math.round((startOfDay(o.pickupAt)-startOfDay(Date.now()))/864e5); return d<0?"late":d===0?"today":d===1?"tomorrow":"later"; }
function orderCounts(){
  const os=S.orders.filter(o=>o.status!=="paid"&&o.status!=="cancelled");
  const pre=os.filter(o=>o.type==="pre"), codOwed=S.orders.filter(o=>o.status==="sent"&&o.pay==="cod");
  return {pending:os.filter(o=>o.status==="pending"&&o.type!=="pre").length, sent:os.filter(o=>o.status==="sent").length,
    preToday:pre.filter(o=>["late","today"].includes(preWhen(o))).length, preTomorrow:pre.filter(o=>preWhen(o)==="tomorrow").length,
    pre:pre.length, codN:codOwed.length, codAmt:sum(codOwed,oDueAmt)};

function statusPill(o){

  else { list=S.orders.filter(o=>o.status==="paid"||o.status==="cancelled").sort((a,b)=>(b.paidAt||b.at)-(a.paidAt||a.at)).slice(0,80);

  const help=tab==="cod"?t("codHelp"):tab==="pre"?t("preHelp"):t("ordersHelp");

function moveStock(o,dir){ (o.lines||[]).forEach(l=>{ if(!l.pid) return; const p=S.products.find(x=>x.id===l.pid); if(!p) return; p.stock=Math.round((p.stock-dir*l.qty)*1000)/1000; DB.put("products",p); }); }
function setOrderStatus(o,st){
  const now=Date.now();
  if((st==="sent"||st==="paid")&&!o.stockOut){ moveStock(o,1); o.stockOut=true; }
  if(st==="sent"&&!o.sentAt) o.sentAt=now;
  if(st==="paid"&&!o.saleId){
    const items=(o.lines||[]).map(l=>{ const p=l.pid?S.products.find(x=>x.id===l.pid):null; return {pid:l.pid||"",name:l.name,nameBn:l.nameBn||"",qty:l.qty,price:l.price,cost:p?(+p.cost||0):(+l.cost||0)}; });
    if(+o.delivery) items.push({pid:"",name:t("deliveryCharge"),nameBn:"",qty:1,price:+o.delivery,cost:o.pay==="cod"?0:0});
    const sale={id:uid(),at:now,items,subtotal:oTotal(o),discount:0,total:oTotal(o),method:o.pay==="cod"?"cod":o.pay,customer:o.customer||"",note:t("orderWord"),paidAt:now,orderId:o.id};
    S.sales.push(sale); DB.put("sales",sale); o.saleId=sale.id; o.paidAt=now;
  }
  if(st==="cancelled"&&o.stockOut&&!o.saleId){ moveStock(o,-1); o.stockOut=false; }
  o.status=st; DB.put("orders",o);
}
function waLink(phone,text){ let d=String(phone||"").replace(/[^\d]/g,""); if(d.indexOf("01")===0) d="88"+d; else if(/^1\d{9}$/.test(d)) d="880"+d; text=String(text).replace(/[\u{1F000}-\u{1FAFF}\u2600-\u27BF]\uFE0F?/gu,"").replace(/^ +| +$/gm,""); return "https:\/\/api.whatsapp.com/send?"+(d?"phone="+d+"&":"")+"text="+encodeURIComponent(text); }
function receiptText(x,kind){

function stats(from){
  const ss=S.sales.filter(s=>s.at>=from), es=S.entries.filter(e=>e.at>=from);
  const sales=sum(ss,s=>s.total), cogs=sum(ss,s=>sum(s.items,i=>i.qty*i.cost));
  // Stock purchases are already counted through product cost (cogs), so they are kept out of expenses to avoid counting them twice.
  const exp=sum(es.filter(e=>e.type==="expense"&&e.category!=="purchase"),e=>e.amount), buy=sum(es.filter(e=>e.type==="expense"&&e.category==="purchase"),e=>e.amount), inc=sum(es.filter(e=>e.type==="income"),e=>e.amount);
  return {ss,count:ss.length,sales,profit:sales-cogs,exp,buy,inc,net:sales-cogs+inc-exp};
}

function spark(){
  const pts=[]; for(let i=6;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); const k=dayKey(d); pts.push(sum(S.sales.filter(s=>dayKey(s.at)===k),s=>s.total)); }
  const mx=Math.max(...pts,1), W=110,H=48; const xy=pts.map((v,i)=>[i*W/6, H-4-(v/mx)*(H-10)]);
  let d="M"+xy.map(p=>p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" L");
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" aria-hidden="true"><path d="${d} L${W} ${H} L0 ${H}z" fill="rgba(255,255,255,.18)"/><path d="${d}" fill="none" stroke="#F2FFF8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
function chart(){
  const days = !can("reports")?7 : S.period==="30"?30 : S.period==="month"? new Date().getDate() : 7;
  const W=640,H=230,pl=56,pr=8,pt=24,pb=28; const iw=W-pl-pr, ih=H-pt-pb;
  const data=[]; for(let i=days-1;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); const k=dayKey(d); data.push({k,d:d.getTime(),v:sum(S.sales.filter(s=>dayKey(s.at)===k),s=>s.total)}); }
  const mx=Math.max(...data.map(d=>d.v),0); const step=mx>0?Math.pow(10,Math.floor(Math.log10(mx))):1; const top=mx>0?Math.ceil(mx/step)*step:4;
  const bw=iw/days; let g=`<defs><linearGradient id="barg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#5FF0AE"/><stop offset="1" stop-color="#1E9E63"/></linearGradient></defs>`;
  for(let j=0;j<=4;j++){ const val=top*j/4, y=pt+ih-ih*j/4; g+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/><text x="${pl-8}" y="${y+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="var(--font-num)">${esc((mx>0?"৳":"")+N(Math.round(val)))}</text>`; }
  const every=days>14?5:1;
  data.forEach((d,i)=>{ const h=ih*d.v/top, x=pl+i*bw+bw*.17, w=bw*.66;
    if(h>0) g+=`<rect class="barr" x="${x.toFixed(1)}" y="${(pt+ih-h).toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="${Math.min(6,w/4).toFixed(1)}" fill="url(#barg)"><title>${esc(fdate(d.d))}: ${esc(M(d.v))}</title></rect>`;
    if(days<=7&&d.v>0) g+=`<text x="${(x+w/2).toFixed(1)}" y="${(pt+ih-h-6).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="600" fill="var(--ink)" font-family="var(--font-num)">${esc(M(d.v))}</text>`;
    if((days-1-i)%every===0) g+=`<text x="${(pl+i*bw+bw/2).toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="12" fill="var(--muted)" font-family="var(--font-body)">${esc(days>7?fdate(d.d,{day:"numeric"}):fdate(d.d,{weekday:"short"}))}</text>`; });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t("salesChart"))}">${g}</svg>`;
}

function addToCart(id){
  const p=S.products.find(x=>x.id===id); if(!p) return;

  if(q>p.stock){ toast(t("onlyLeft",{n:N(Math.max(0,p.stock))})); return; }
  if(c) c.qty=q; else S.cart.push({pid:id,qty:1,price:p.price});
  refreshCart();
}
function completeSale(){
  if(!S.cart.length) return;
  if(S.co.method==="due"&&!S.co.customer.trim()){ toast(t("needCustomer")); $("#coCust")?.focus(); return; }
  const tt=cartTotals(), at=Date.now();
  const items=S.cart.map(c=>{const p=S.products.find(x=>x.id===c.pid); return {pid:c.pid,name:p.name,nameBn:p.nameBn||"",qty:c.qty,price:c.price,cost:+p.cost||0};});
  const sale={id:uid(),at,items,subtotal:tt.sub,discount:tt.disc,total:tt.total,method:S.co.method,customer:S.co.customer.trim(),note:"",paidAt:S.co.method==="due"?null:at};
  S.sales.push(sale); DB.put("sales",sale);
  items.forEach(i=>{const p=S.products.find(x=>x.id===i.pid); p.stock=Math.round((p.stock-i.qty)*1000)/1000; DB.put("products",p);});
  S.cart=[]; S.co={discount:"",method:"cash",customer:"",note:""};

function handleBarcode(code){
  code=String(code).trim(); if(!code) return;
  if(!can("barcode")) return;
  if(S.scanTarget==="form"){ const el=$("#pBarcode"); if(el) el.value=code; S.scanTarget=null; return; }
  const p=S.products.find(x=>x.barcode&&x.barcode===code);
  if(!p){ beep(false); unknownSheet(code); return; }
  const before=S.cart.find(x=>x.pid===p.id)?.qty||0;
  addToCart(p.id);
  const after=S.cart.find(x=>x.pid===p.id)?.qty||0;
  beep(after>before);
  if(after>before) showLastScan(p,after);
}

let audioCtx=null;
function beep(ok){
  if(!S.meta.scanSound) return;
  try{ audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    const tones=ok?[[1850,.09]]:[[420,.12],[320,.16]]; let at=audioCtx.currentTime;
    tones.forEach(([f,d])=>{ const o=audioCtx.createOscillator(), g=audioCtx.createGain(); o.type="square"; o.frequency.value=f; g.gain.value=.06; o.connect(g); g.connect(audioCtx.destination); o.start(at); o.stop(at+d); at+=d+.05; });
  }catch(e){}
}

const SCAN={buf:"",last:0};
document.addEventListener("keydown",ev=>{
  if(!S.meta.scanMode||S.view!=="sell"||!can("barcode")||S.sheet) return;
  const tg=ev.target, typing=tg&&(tg.tagName==="INPUT"||tg.tagName==="TEXTAREA"||tg.tagName==="SELECT")&&tg.id!=="scanInput";
  if(typing||ev.ctrlKey||ev.metaKey||ev.altKey) return;
  const now=performance.now();
  if(now-SCAN.last>120) SCAN.buf="";
  SCAN.last=now;
  if(ev.key==="Enter"){ if(SCAN.buf.length>=3){ ev.preventDefault(); const c=SCAN.buf; SCAN.buf=""; if(tg.id==="scanInput") tg.value=""; handleBarcode(c); } return; }
  if(ev.key.length===1){ SCAN.buf+=ev.key; if(tg.id!=="scanInput") ev.preventDefault(); }
},true);

function openSheet(name,html){ S.sheet=name; $("#sheetRoot").innerHTML=`<div class="overlay" data-act="overlay"><div class="sheet" role="dialog" aria-modal="true" id="sheetBody">${html}</div></div>`; }

let toastT; function toast(m){ $("#toastRoot").innerHTML=`<div class="toast" role="status">${esc(m)}</div>`; clearTimeout(toastT); toastT=setTimeout(()=>$("#toastRoot").innerHTML="",2600); }

async function openScanner(target){
  S.scanTarget=target==="form"?"form":null;
  if(!("BarcodeDetector" in window)||!navigator.mediaDevices?.getUserMedia){ toast(t("noCamScan")); return; }
  const prev=S.sheet==="product"?$("#sheetBody").innerHTML:null;
  try{
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});
    const det=new BarcodeDetector();
    const holder=document.createElement("div"); holder.className="overlay"; holder.style.zIndex=55;
    holder.innerHTML=`<div class="sheet"><div class="sheet-head"><h2>${t("camera")}</h2><button class="iconbtn" id="scanClose">${I.x}</button></div><video class="scan" playsinline autoplay muted></video></div>`;
    document.body.appendChild(holder); const v=holder.querySelector("video"); v.srcObject=stream;
    let done=false; const stop=()=>{done=true;stream.getTracks().forEach(x=>x.stop());holder.remove();};
    holder.querySelector("#scanClose").onclick=stop;
    const loop=async()=>{ if(done) return; try{ const r=await det.detect(v); if(r&&r[0]){ stop(); handleBarcode(r[0].rawValue); return; } }catch(e){} setTimeout(loop,250); };
    v.onloadedmetadata=loop;
  }catch(e){ toast(t("camDenied")); }
}
function resizeImage(file){ return new Promise(res=>{ const r=new FileReader(); r.onload=()=>{ const img=new Image(); img.onload=()=>{ const s=320, sc=Math.min(1,s/Math.max(img.width,img.height)); const c=document.createElement("canvas"); c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc); c.getContext("2d").drawImage(img,0,0,c.width,c.height); res(c.toDataURL("image/jpeg",.78)); }; img.onerror=()=>res(""); img.src=r.result; }; r.onerror=()=>res(""); r.readAsDataURL(file); }); }

    S.products=S.products.filter(p=>p.id!==el.dataset.id); S.cart=S.cart.filter(c=>c.pid!==el.dataset.id); DB.del("products",el.dataset.id); closeSheet(); render(); toast(t("deleted")); },
  restock(el){ restockForm(S.products.find(p=>p.id===el.dataset.id)); },
  viewSale(el){ saleSheet(S.sales.find(s=>s.id===el.dataset.id)); },
  delSale(el){ if(S.armed!=="s"+el.dataset.id){ S.armed="s"+el.dataset.id; el.textContent=t("tapAgain"); el.classList.add("armed"); return; }
    const s=S.sales.find(x=>x.id===el.dataset.id); s.items.forEach(i=>{const p=S.products.find(x=>x.id===i.pid); if(p){p.stock=Math.round((p.stock+i.qty)*1000)/1000; DB.put("products",p);}});
    S.sales=S.sales.filter(x=>x!==s); DB.del("sales",s.id); closeSheet(); render(); toast(t("stockRestored")); },
  newEntry(el){ entryForm(el&&el.dataset&&el.dataset.v); },
  etype(el){ S.edit.type=el.dataset.v; document.querySelectorAll("#eSeg button").forEach(b=>b.classList.toggle("on",b===el)); $("#eCat").innerHTML=catOpts(el.dataset.v); },
  delEntry(el){ const k="e"+el.dataset.id; if(S.armed!==k){ S.armed=k; render(); return; } S.entries=S.entries.filter(e=>e.id!==el.dataset.id); DB.del("entries",el.dataset.id); S.armed=null; render(); toast(t("deleted")); },
  markPaid(el){ const now=Date.now(); S.sales.filter(s=>s.method==="due"&&!s.paidAt&&(s.customer||"?")===el.dataset.v).forEach(s=>{s.paidAt=now;DB.put("sales",s);}); render(); toast(t("saved")); },
  sinc(el){ const p=S.products.find(x=>x.id===el.dataset.id); const q=(S.shopCart[p.id]||0)+1; if(q>p.stock){toast(t("onlyLeft",{n:N(p.stock)}));return;} S.shopCart[p.id]=q; render(); },
  sdec(el){ const id=el.dataset.id; S.shopCart[id]=(S.shopCart[id]||0)-1; if(S.shopCart[id]<=0) delete S.shopCart[id]; render(); },
  clearSample(){ wipe(); S.meta.sample=false; if(!GAS){ S.meta.shopName=""; S.meta.phone=""; } saveMeta(); if(GAS) Sync.pull(); shell(); render(); toast(t("cleared")); },
  reset(){ if(S.armed!=="reset"){ S.armed="reset"; render(); return; } wipe(); S.meta={id:"settings",shopName:"",phone:"",lang:S.meta.lang,sample:false,showCount:true,seeded:true,access:S.meta.access,demoStart:S.meta.demoStart,guideSeen:S.meta.guideSeen}; saveMeta(); S.armed=null; shell(); render(); toast(t("deleted")); },
  exportJson(){ download("dokan-khata-backup-"+dayKey(Date.now())+".json",JSON.stringify({app:"dokan-khata",v:2,meta:S.meta,products:S.products,sales:S.sales,entries:S.entries,orders:S.orders}),"application/json"); },
  exportCsv(){ const q=v=>'"'+String(v??"").replace(/"/g,'""')+'"';
    const rows=[["date","time","items","total","discount","payment","customer","profit"]].concat([...S.sales].sort((a,b)=>a.at-b.at).map(s=>[dayKey(s.at),new Date(s.at).toTimeString().slice(0,5),s.items.map(i=>i.name+" x"+i.qty).join("; "),s.total,s.discount,s.method,s.customer,s.total-sum(s.items,i=>i.qty*i.cost)]));
    download("sales-"+dayKey(Date.now())+".csv","﻿"+rows.map(r=>r.map(q).join(",")).join("\n"),"text/csv"); },
  close(){ closeSheet(); },
  scanMode(){ S.meta.scanMode=!S.meta.scanMode; if(S.meta.scanMode&&S.meta.scanSound===undefined) S.meta.scanSound=true; saveMeta(); if(S.meta.scanMode) beep(true); render(); },
  scanSound(){ S.meta.scanSound=!S.meta.scanSound; saveMeta(); if(S.meta.scanSound) beep(true); render(); },
  newFromCode(el){ const code=el.dataset.v; closeSheet(); if(!can("unlimited")&&S.products.length>=CONFIG.productLimit){ upgradeSheet("unlimited"); return; } productForm(null); const b=$("#pBarcode"); if(b) b.value=code; setTimeout(()=>$("#pName")?.focus(),50); },
  gateLang(el){ S.meta.lang=el.dataset.v; saveMeta(); shell(); render(); },
  acceptTerms(){ if(!$("#termsChk")?.checked) return; S.meta.termsOk=Date.now(); lsSet("dk-terms",String(S.meta.termsOk)); saveMeta(); render(); },
  startTrial(){ S.meta.demoStart=Date.now(); lsSet("dk-demo",String(S.meta.demoStart)); saveMeta(); startDemoTicker(); shell(); location.hash="#home"; render(); },
  gatePeek(){ S.meta.demoStart=S.meta.demoStart||0; $("#gateRoot").innerHTML=""; document.body.classList.remove("gated"); S.peek=true; },
  upgrade(el){ upgradeSheet(el.dataset.f); },
  buy(el){ paySheet(el.dataset.v); },
  payMethod(el){ S.edit.method=el.dataset.v; document.querySelectorAll("#paySeg button").forEach(b=>b.classList.toggle("on",b===el)); $("#payBody").innerHTML=payBody(); },
  overlay(el,ev){ if(ev.target===el) closeSheet(); }
};
document.addEventListener("click",ev=>{
  const el=ev.target.closest("[data-act]"); if(!el) return;
  const fn=A[el.dataset.act]; if(!fn) return;
  if(el.tagName==="BUTTON"&&el.type!=="submit") ev.preventDefault();
  if(el.dataset.act!=="overlay"&&!/^(delProduct|delSale|delEntry|delOrder|reset)$/.test(el.dataset.act)) S.armed=null;
  fn(el,ev);
});
document.addEventListener("submit",ev=>{ ev.preventDefault(); const f=ev.target;
  if(f.id==="authForm"){ doAuth(); return; } if(f.id==="storeForm"){ doStore(); return; }
  if(f.id==="codeForm"||f.id==="gateCodeForm") activate($(f.id==="codeForm"?"#codeIn":"#gateCodeIn").value); else if(f.id==="payForm") submitPayment(); else if(f.id==="pForm") saveProduct(f); else if(f.id==="rForm") saveRestock(f); else if(f.id==="eForm") saveEntry(); else if(f.id==="oForm") saveOrder(); });
document.addEventListener("input",ev=>{
  const el=ev.target;
  if(el.id==="termsChk"){ $("#termsBtn").disabled=!el.checked; return; }
  if(el.id==="q"){ S.q=el.value; const g=$("#grid"); if(!g) return;
    if(S.view==="sell") g.innerHTML=sellGrid(); else if(S.view==="products") render(), $("#q").focus(), $("#q").setSelectionRange(S.q.length,S.q.length); else if(S.view==="shop") { render(); const q=$("#q"); q.focus(); q.setSelectionRange(S.q.length,S.q.length);} return; }
  if(el.dataset.co){ S.co[el.dataset.co]=el.value; if(el.dataset.co==="discount"){ const tt=cartTotals(); ["#coTotal","#coTotal2"].forEach(s=>{const x=$(s); if(x) x.textContent=M(tt.total)}); renderCartbar(); } return; }
  if(el.dataset.meta){ S.meta[el.dataset.meta]=el.type==="checkbox"?el.checked:el.value; saveMeta(); document.querySelectorAll(".brand-text b").forEach(b=>b.textContent=S.meta.shopName||"Store Flow"); }
});
document.addEventListener("change",async ev=>{
  const el=ev.target;
  if(el.id==="termsChk"){ $("#termsBtn").disabled=!el.checked; }
  if(el.id==="oPreChk"){ const w=$("#oPreWrap"); if(w) w.style.display=el.checked?"":"none"; }
  if(el.id==="oDel"||el.id==="oAdv"){ renderOLines(); }
  if(el.id==="pPhoto"&&el.files[0]){ S.edit.photo=await resizeImage(el.files[0]); if(S.edit.photo) $("#pPhotoPrev").innerHTML=`<img src="${S.edit.photo}" alt="">`; }
  if(el.id==="importFile"&&el.files[0]){ try{ const d=JSON.parse(await el.files[0].text()); if(d.app!=="dokan-khata"||!Array.isArray(d.products)) throw 0;
      wipe(); S.products=d.products; S.sales=d.sales||[]; S.entries=d.entries||[]; S.orders=d.orders||[]; S.meta=Object.assign(S.meta,d.meta||{},{id:"settings"});
      S.products.forEach(p=>DB.put("products",p)); S.sales.forEach(s=>DB.put("sales",s)); S.entries.forEach(e=>DB.put("entries",e)); S.orders.forEach(o=>DB.put("orders",o)); saveMeta(); shell(); render(); toast(t("imported"));
    }catch(e){ toast(t("badFile")); } el.value=""; }
});
document.addEventListener("keydown",ev=>{
  if(ev.key==="Enter"&&ev.target.id==="scanInput"){ ev.preventDefault(); handleBarcode(ev.target.value); ev.target.value=""; }
  if(ev.key==="Escape"&&S.sheet) closeSheet();
});
const VIEWS=["home","sell","orders","products","money","shop","setup","plans","guide","terms","code"];
Object.assign(A,AUTH_ACTS,ORDER_ACTS);
document.addEventListener("keydown",e=>{ const el=e.target; if(el&&el.id==="gq"&&e.key==="Enter"){ e.preventDefault(); const v=el.value; el.value=""; location.hash="sell"; setTimeout(()=>{ S.q=v; render(); const q=$("#q"); if(q){ q.focus(); q.setSelectionRange(v.length,v.length);} },60); } });
function route(){ const h=location.hash.replace("#",""); S.view=VIEWS.includes(h)?h:"home"; if(S.view==="guide"&&!S.meta.guideSeen){ S.meta.guideSeen=true; saveMeta(); } S.q=""; S.cat=""; S.armed=null; if(S.sheet) closeSheet(); render(); window.scrollTo(0,0); }
addEventListener("hashchange",route);
let wasWide=wide(); addEventListener("resize",()=>{ const w=wide(); if(w!==wasWide){ wasWide=w; if(S.sheet==="cart") closeSheet(); if(S.view==="sell") render(); } });

/* ---------- start ---------- */
(async function start(){
  const ok=await DB.open();
  if(ok){ const [p,s,e,m,o]=await Promise.all(["products","sales","entries","meta","orders"].map(x=>DB.all(x)));
    S.products=p; S.sales=s; S.entries=e; S.orders=o||[]; const st=m.find(x=>x.id==="settings"); if(st) S.meta=Object.assign(S.meta,st); }
  if(!GAS&&!S.products.length&&!S.sales.length&&!S.meta.shopName&&!S.meta.seeded){ seed(); S.meta.seeded=true; saveMeta(); }
  Sync.load();
  let urlCode=new URLSearchParams(location.search).get("code");
  if(GAS&&!urlCode){ urlCode=await new Promise(r=>{ try{ google.script.url.getLocation(l=>r((l.parameter||{}).code||null)); }catch(e){ r(null); } setTimeout(()=>r(null),3000); }); }
  if(GAS){
    if(urlCode){ S.pendingCode=urlCode; lsSet("dk-pending",urlCode); try{ history.replaceState(null,"",location.pathname+(location.hash||"#home")); }catch(e){} }
    const cached=loadAuth();
    if(cached&&cached.token){
      S.auth=cached; S.access=cached.access||null;
      try{ applyState(await gs("session",cached.token)); }
      catch(e){ if(String(e&&e.message||e).includes("AUTH")){ S.auth=null; S.access=null; saveAuth(); } }
    }
    if(S.auth){ adoptAccount(); const pend=S.pendingCode||lsGet("dk-pending"); if(pend){ S.pendingCode=null; lsSet("dk-pending",""); await activate(pend,true); } }
    if(inDemo()) startDemoTicker();
    shell(); route();
    if(S.auth){ await Sync.pull(); Sync.flush(); }
    return;
  }
  const saved=S.meta.access||lsGet("dk-access");
  if(urlCode){ await activate(urlCode,true); try{ history.replaceState(null,"",location.pathname+(location.hash||"#home")); }catch(e){} }
  else if(saved){ S.access=await verifyCode(saved); }
  if(!S.meta.termsOk&&lsGet("dk-terms")) S.meta.termsOk=+lsGet("dk-terms");
  if(!S.meta.demoStart&&lsGet("dk-demo")) S.meta.demoStart=+lsGet("dk-demo");
  if(inDemo()) startDemoTicker();
  shell(); route();
  if(urlCode&&S.access) toast(t("unlocked",{plan:t("tier_"+S.access.tier)}));
  if(GAS&&S.access){ await Sync.pull(); Sync.flush(); }
})();
</script>
